[project]
name = "knowledgepilot-backend"
version = "0.1.0"
description = "KnowledgePilot backend: Agentic Personal Knowledge Workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "mcp>=1.2,<2",
  "docling[rapidocr]>=2.152,<3",
]

[dependency-groups]
dev = [
    "pypdf>=5,<7",
    "pytest>=8,<10",
    "python-docx>=1.1,<2",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_parsers: build apps with the real parser registry (Docling worker)"]

[tool.ruff]
target-version = "py311"
line-length = 100
